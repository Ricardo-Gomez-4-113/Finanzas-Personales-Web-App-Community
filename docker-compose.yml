services:
  finanzas-community:
    build: .
    container_name: finanzas-community
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:8002:8001"
    env_file:
      - .env
    networks:
      - default
      - asistente_telegram
      - asistente_web
    environment:
      # Dónde está el servicio del asistente web (perfil `asistente`). Sin él arriba la burbuja simplemente no aparece.
      ASISTENTE_WEB_URL: http://finanzas-asistente:8100
      # Fijos y avisos también con la app cerrada: una ronda cada NOTIFICACIONES_PERIODO_MIN minutos (60 por defecto). NOTIFICACIONES_TAREA=0 la apaga.
      NOTIFICACIONES_TAREA: ${NOTIFICACIONES_TAREA:-1}
      NOTIFICACIONES_PERIODO_MIN: ${NOTIFICACIONES_PERIODO_MIN:-60}
    volumes:
      # Solo los datos persisten fuera del contenedor (el código va dentro de la imagen)
      - ./data:/app/data

  # Bot de Telegram del asistente. Opcional: no arranca con `docker compose up -d` a secas, solo con
  # `docker compose --profile asistente up -d finanzas-bot`. Necesita en .env: TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME, GEMINI_API_KEY
  # y ASISTENTE_SECRETO_INTERNO (el mismo valor lo lee la app). Está aislado a propósito: no recibe el .env completo (ni la clave JWT, ni el
  # correo), no monta la carpeta de datos, no tiene root ni sistema de archivos de escritura. Todo lo que necesita de las cuentas se lo pide a la
  # app por /internal/asistente, que solo le da tokens de un minuto de chats vinculados.
  finanzas-bot:
    profiles: ["asistente"]
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: finanzas-bot
    restart: unless-stopped
    networks:
      - asistente_telegram   # solo ve a la app; no alcanza al servicio del asistente web
    depends_on:
      - finanzas-community
    environment:
      APP_URL: http://finanzas-community:8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_RESPALDO: ${GEMINI_MODEL_RESPALDO:-}
      # Qué modelo usa el asistente: gemini (por defecto) u ollama, con el otro de respaldo (opcional). Ver .env.example
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-}
      ASISTENTE_MODELO_RESPALDO: ${ASISTENTE_MODELO_RESPALDO:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ASISTENTE_SECRETO_INTERNO: ${ASISTENTE_SECRETO_INTERNO}
      # Los módulos de la app que importa exigen una clave JWT para arrancar. Esta es de relleno y NO es la real: el bot no puede firmar nada válido.
      JWT_SECRET_KEY: relleno-del-bot-que-no-es-la-clave-real-0000000000
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Asistente de la burbuja web: la misma imagen y el mismo código que el bot, otro canal y otro servicio (se levanta, se reinicia y se apaga por
  # separado). Solo lo llama la app por la red interna (no publica puertos). Mismo aislamiento que el bot: sin .env completo, sin base de datos,
  # sin la clave JWT real, sin root. Necesita en .env: GEMINI_API_KEY y ASISTENTE_SECRETO_INTERNO.
  finanzas-asistente:
    profiles: ["asistente"]
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: finanzas-asistente
    mem_limit: 768m   # 16 peticiones a la vez con archivos de hasta 8 MB: un tope duro para que un exceso no afecte al resto del servidor
    pids_limit: 128
    networks:
      - asistente_web   # solo ve a la app; no alcanza al bot
    command: ["python3", "-m", "asistente.servidor_web"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - finanzas-community
    environment:
      APP_URL: http://finanzas-community:8001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_RESPALDO: ${GEMINI_MODEL_RESPALDO:-}
      # Qué modelo usa el asistente: gemini (por defecto) u ollama, con el otro de respaldo (opcional). Ver .env.example
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-}
      ASISTENTE_MODELO_RESPALDO: ${ASISTENTE_MODELO_RESPALDO:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ASISTENTE_WEB_SECRETO: ${ASISTENTE_WEB_SECRETO}   # otro valor que el del bot: este servicio no tiene el secreto de Telegram
      JWT_SECRET_KEY: relleno-del-bot-que-no-es-la-clave-real-0000000000
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Redes separadas: el bot de Telegram y el servicio del asistente web solo comparten con la app, nunca entre ellos
networks:
  asistente_telegram:
  asistente_web:
