services:
  finanzas-community:
    build: .
    container_name: finanzas-community
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:8002:8001"
    env_file:
      - .env
    volumes:
      # Solo los datos persisten fuera del contenedor (el código va dentro de la imagen)
      - ./data:/app/data
